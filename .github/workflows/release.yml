name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  pc:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, out: phone-cam-pc-linux-x86_64, bin: phone-cam }
          - { os: windows-latest, out: phone-cam-pc-windows-x86_64.exe, bin: phone-cam.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release
        working-directory: pc
      - run: cargo build --release
        working-directory: pc
      - shell: bash
        run: cp pc/target/release/${{ matrix.bin }} ${{ matrix.out }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out }}
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Keystore
        env:
          KS: ${{ secrets.PHONECAM_KEYSTORE_B64 }}
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; fi
      - name: Build APK
        working-directory: android
        env:
          PHONECAM_KEYSTORE: ${{ runner.temp }}/release.jks
          PHONECAM_KEYSTORE_PASSWORD: ${{ secrets.PHONECAM_KEYSTORE_PASSWORD }}
          PHONECAM_KEY_ALIAS: ${{ secrets.PHONECAM_KEY_ALIAS }}
          PHONECAM_KEY_PASSWORD: ${{ secrets.PHONECAM_KEY_PASSWORD }}
        run: |
          [ -f "$RUNNER_TEMP/release.jks" ] || unset PHONECAM_KEYSTORE
          ./gradlew assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk phone-cam-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: phone-cam-android.apk
